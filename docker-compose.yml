# Production-shaped local infrastructure for this service: a real, standalone
# Kafka broker (KRaft mode, no ZooKeeper) and a real PostgreSQL instance.
#
# This file documents how the production `application.yml` profile is meant
# to be stood up; it is not what produced the measured numbers in the README.
# Docker Desktop's daemon was not running in the environment this project was
# built in, so every measured number in this repository comes from tests
# that run against an embedded, in-process Kafka broker (spring-kafka-test's
# EmbeddedKafkaKraftBroker) and an in-memory H2 database in PostgreSQL
# compatibility mode instead. See README.md, "Honest framing, up front".
#
# To actually run the service against this stack:
#   docker compose up -d
#   export PATH toolchain as usual, then:
#   mvn spring-boot:run
version: "3.8"
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: settlement-matching-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    container_name: settlement-matching-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: settlement_matching
      POSTGRES_USER: settlement_app
      POSTGRES_PASSWORD: settlement_app_local_only
    volumes:
      - settlement_matching_pgdata:/var/lib/postgresql/data

volumes:
  settlement_matching_pgdata:
