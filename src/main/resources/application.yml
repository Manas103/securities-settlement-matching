# Production wiring: a real Kafka cluster and a real PostgreSQL instance.
# Tests and the measurement runs never load this file; they use
# src/test/resources/application.yml, which points at an embedded Kafka
# broker and an in-memory H2 database in PostgreSQL-compatibility mode
# instead, because no standalone broker or database is available in this
# build environment. See the README's "honest framing" section.
spring:
  application:
    name: securities-settlement-matching
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: settlement-matching-service
  datasource:
    url: jdbc:postgresql://localhost:5432/settlement_matching
    username: settlement_app
    password: ${SETTLEMENT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

settlement:
  kafka:
    topic: settlement-instructions
  tolerance-rules-resource: tolerance-rules.yml

golden-copy:
  demo-security-count: 25
  demo-missingness-rate: 0.1
  demo-disagreement-rate: 0.3
  demo-seed: 20260701

logging:
  level:
    com.manas.settlementmatch: INFO
